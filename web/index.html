<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traffic Surveillance</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 9h11l4-3v12l-4-3H3z"/><circle cx="8" cy="12" r="1.5" fill="#fff"/></svg></div>
        <div><b>Traffic Surveillance</b><span>Dhaka traffic enforcement</span></div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/" data-route="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Dashboard</a>
        <a href="#/cameras" data-route="cameras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h12l4-3v14l-4-3H3z"/></svg>Cameras</a>
        <a href="#/review" data-route="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2h9"/></svg>Review<span class="count hidden" id="pending-count"></span></a>
        <a href="#/disputes" data-route="disputes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M5 7h14M5 7l-2 6a3 3 0 006 0zM19 7l-2 6a3 3 0 006 0z"/></svg>Disputes<span class="count hidden" id="dispute-count"></span></a>
        <a href="/map" data-route="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</a>
        <a href="/city" data-route="city"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V9l6-4v16M9 21V3l8 4v14M17 21v-9l4 2v7M2 21h20"/></svg>3D city</a>
        <a href="/query" data-route="query"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Ask</a>
        <a href="/storage" data-route="storage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>Storage</a>
        <a href="#/vehicles" data-route="vehicles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17H3v-5l2-5h11l3 5h2v5h-2"/><circle cx="7.5" cy="17" r="2"/><circle cx="17.5" cy="17" r="2"/></svg>Vehicles</a>
        <a href="#/admin" data-route="admin" id="nav-admin" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>Accounts</a>
        <a href="#/stats" data-route="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistics</a>
      </nav>
      <div class="sidebar-foot">
        <div><span class="sse-dot" id="sse-dot"></span><span id="sse-text">Connecting...</span></div>
        <div id="lan-url"></div>
        <div id="who-box" class="who-box" hidden><span id="who-name"></span><span id="who-role"></span>
          <button class="btn small ghost" id="signout" type="button">Sign out</button></div>
        <button class="btn small ghost" id="theme-btn" type="button">Toggle light / dark</button>
      </div>
    </aside>
    <div class="content">
      <header class="topbar">
        <span id="online" class="online"><span class="dot"></span>…</span>
        <span class="spacer"></span>
        <input id="plate-search" type="search" placeholder="Find a plate… (Enter)" aria-label="Search number plate">
        <span id="clock" class="clock mono"></span>
      </header>
      <main id="main"></main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/editor.js"></script>
</body>
</html>
