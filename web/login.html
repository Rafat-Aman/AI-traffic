<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Dhaka Traffic Surveillance</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .auth { width: 100%; max-width: 420px; }
  .auth h1 { font-size: 21px; margin: 0 0 4px; }
  .auth .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 18px; line-height: 1.5; }
  .auth .card { padding: 22px; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 9px; margin-bottom: 18px; }
  .tabs button { flex: 1; padding: 9px; border: 0; border-radius: 6px; background: transparent;
                 color: var(--text-secondary); font: inherit; font-size: 13px; cursor: pointer; }
  .tabs button.on { background: var(--surface-1); color: var(--text-primary); font-weight: 600; box-shadow: var(--shadow); }
  .auth .field { display: block; margin-bottom: 13px; }
  .auth input { width: 100%; }
  .auth .btn { width: 100%; justify-content: center; margin-top: 4px; }
  .msg { font-size: 13px; padding: 9px 11px; border-radius: 7px; margin-bottom: 13px; line-height: 1.45; }
  .msg.err { background: color-mix(in srgb, var(--critical-ink) 14%, transparent); color: var(--critical-ink); }
  .msg.ok  { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .demo-code { font-size: 25px; letter-spacing: 7px; font-weight: 700; text-align: center;
               padding: 9px; background: var(--surface-3); border-radius: 7px; margin: 9px 0; }
  .foot { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 15px; line-height: 1.5; }
</style></head>
<body><div class="auth-wrap"><div class="auth">
  <h1>Dhaka Traffic Surveillance</h1>
  <div class="sub">Sign in to continue.</div>
  <div class="card">
    <div class="tabs">
      <button id="t-driver" class="on">I am a driver</button>
      <button id="t-staff">Traffic police</button>
    </div>
    <div id="msg"></div>

    <form id="f-driver">
      <label class="field">Driving licence number
        <input id="licence" autocomplete="username" placeholder="e.g. DK-1234567" autofocus></label>
      <div id="code-step" hidden>
        <div id="code-shown"></div>
        <label class="field">The 6-digit code sent to your mobile
          <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>
      </div>
      <button class="btn primary" id="driver-go" type="submit">Send me a code</button>
    </form>

    <form id="f-staff" hidden>
      <label class="field">Username<input id="username" autocomplete="username"></label>
      <label class="field">Password<input id="password" type="password" autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
  <div class="foot">Your licence number identifies you; the code is what signs you in.<br>
    We never ask for it by phone or message.</div>
</div></div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const show = (text, kind = "err") => { $("#msg").innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : ""; };
  let stage = "licence";

  async function post(url, body) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                                 body: JSON.stringify(body) });
    let data = {}; try { data = await r.json(); } catch (e) { /* no body */ }
    if (!r.ok) throw new Error(data.detail || `${r.status} ${r.statusText}`);
    return data;
  }
  const tab = (driver) => {
    $("#t-driver").classList.toggle("on", driver); $("#t-staff").classList.toggle("on", !driver);
    $("#f-driver").hidden = !driver; $("#f-staff").hidden = driver; show("");
  };
  $("#t-driver").onclick = () => tab(true);
  $("#t-staff").onclick = () => tab(false);

  $("#f-driver").onsubmit = async (e) => {
    e.preventDefault();
    const licence = $("#licence").value.trim();
    try {
      if (stage === "licence") {
        const r = await post("/api/login/code", { licence_no: licence });
        stage = "code";
        $("#code-step").hidden = false;
        $("#driver-go").textContent = "Sign in";
        $("#licence").readOnly = true;
        $("#code").focus();
        show(r.message, "ok");
        if (r.demo_code) $("#code-shown").innerHTML =
          `<div class="demo-code">${r.demo_code}</div><div class="sub">Shown because this server is in
           demonstration mode. A hosted one sends it by SMS and never displays it.</div>`;
      } else {
        await post("/api/login/verify", { licence_no: licence, code: $("#code").value.trim() });
        location.href = "/portal";
      }
    } catch (err) { show(err.message); }
  };

  $("#f-staff").onsubmit = async (e) => {
    e.preventDefault();
    try {
      await post("/api/login", { username: $("#username").value.trim(), password: $("#password").value });
      location.href = "/";
    } catch (err) { show(err.message); }
  };
})();
</script></body></html>
